<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | LoanWise FinTech Underwriting</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom FinTech CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-wrapper">

<div class="auth-card" style="max-width: 480px;">
    <div class="auth-header">
        <div class="brand-icon-box">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <h3>Join LoanWise</h3>
        <p>Smart Customer Loan Approval Prediction System</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="POST">
        <div class="mb-3">
            <label for="full_name" class="form-label form-label-custom">Full Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-custom" id="full_name" name="full_name"
                   placeholder="e.g. Eleanor Vance" required autofocus>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-12 col-sm-6">
                <label for="username" class="form-label form-label-custom">Username <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-custom" id="username" name="username"
                       placeholder="e.g. evance" required>
            </div>
            <div class="col-12 col-sm-6">
                <label for="role" class="form-label form-label-custom">Account Role <span class="text-danger">*</span></label>
                <select class="form-select form-select-custom" id="role" name="role" required>
                    <option value="customer" selected>Customer</option>
                    <option value="admin">Administrator / Underwriter</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label form-label-custom">Email Address <span class="text-danger">*</span></label>
            <input type="email" class="form-control form-control-custom" id="email" name="email"
                   placeholder="e.g. eleanor@example.com" required>
        </div>

        <div class="row g-2 mb-4">
            <div class="col-12 col-sm-6">
                <label for="password" class="form-label form-label-custom">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control form-control-custom" id="password" name="password"
                       placeholder="At least 6 characters" minlength="6" required>
            </div>
            <div class="col-12 col-sm-6">
                <label for="confirm_password" class="form-label form-label-custom">Confirm Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control form-control-custom" id="confirm_password" name="confirm_password"
                       placeholder="Repeat password" minlength="6" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center">
            <i class="bi bi-check2-circle"></i>
            <span>Complete Registration</span>
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top small text-muted">
        Already registered? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Sign In</a>
        <br/>
        <a href="{{ url_for('dashboard') }}" class="text-secondary small mt-2 d-inline-block">Back to Dashboard</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
